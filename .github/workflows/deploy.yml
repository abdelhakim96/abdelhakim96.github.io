name: deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify static site structure
        run: |
          test -f index.html
          test -f publications/index.html
          test -f projects/index.html
          test -f teaching/index.html
          test -f cv/index.html
          test -f assets/css/academic.css
          test -f assets/js/site.js

